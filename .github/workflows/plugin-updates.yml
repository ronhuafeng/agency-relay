name: Plugin updates

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *' # Daily at 09:17 Asia/Shanghai; GitHub may delay scheduled runs.
  workflow_dispatch:
  pull_request:
    paths:
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/plugin-updates.yml'
      - 'scripts/update-plugin-revisions*.mjs'

permissions:
  contents: read

concurrency:
  group: plugin-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plugins:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Check revision updater
        run: node --test scripts/update-plugin-revisions.test.mjs

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.156.1

      - name: Refresh marketplaces and verify all declared plugins
        shell: bash
        run: |
          set -euo pipefail
          marketplace_name=$(node -p "require('./.agents/plugins/marketplace.json').name")
          codex_marketplace_args=(
            -c "marketplaces.${marketplace_name}.source_type=\"local\""
            -c "marketplaces.${marketplace_name}.source=\"${GITHUB_WORKSPACE}\""
          )
          codex "${codex_marketplace_args[@]}" plugin marketplace upgrade --json
          while IFS= read -r plugin_name; do
            codex "${codex_marketplace_args[@]}" plugin add "${plugin_name}@${marketplace_name}" --json
          done < <(node -p "require('./.agents/plugins/marketplace.json').plugins.map(p => p.name).join('\n')")
          git diff --check

  propose:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Check revision updater
        run: node --test scripts/update-plugin-revisions.test.mjs

      - name: Resolve tracked upstream branches
        run: node scripts/update-plugin-revisions.mjs

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.156.1

      - name: Refresh marketplaces and verify all declared plugins
        shell: bash
        run: |
          set -euo pipefail
          marketplace_name=$(node -p "require('./.agents/plugins/marketplace.json').name")
          codex_marketplace_args=(
            -c "marketplaces.${marketplace_name}.source_type=\"local\""
            -c "marketplaces.${marketplace_name}.source=\"${GITHUB_WORKSPACE}\""
          )
          codex "${codex_marketplace_args[@]}" plugin marketplace upgrade --json
          while IFS= read -r plugin_name; do
            codex "${codex_marketplace_args[@]}" plugin add "${plugin_name}@${marketplace_name}" --json
          done < <(node -p "require('./.agents/plugins/marketplace.json').plugins.map(p => p.name).join('\n')")
          git diff --check

      - name: Open a reviewed PR for updated plugin revisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .agents/plugins/marketplace.json; then
            echo 'No upstream plugin changes; no PR needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pending=$(gh pr list --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/plugin-revisions-"))] | length')
          if [ "$pending" -gt 0 ]; then
            echo "An automated plugin-update PR is already open. Review it before generating another." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/plugin-revisions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .agents/plugins/marketplace.json
          git commit -m 'chore(plugins): update upstream plugin revisions'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          gh pr create --draft --base main --head "$branch" \
            --title 'chore(plugins): update upstream plugin revisions' \
            --body 'Automated plugin revision proposal for human review. Related: #16, roadmap #15. Do not merge until all required checks on the candidate pass; bot-created PR checks may require Actions approval.'
          actual_sha=$(gh pr view "$branch" --json headRefOid --jq '.headRefOid')
          test "$actual_sha" = "$(git rev-parse HEAD)"
          echo "Opened a draft PR for $branch at $actual_sha. Review and approve its required workflows before merge." >> "$GITHUB_STEP_SUMMARY"
