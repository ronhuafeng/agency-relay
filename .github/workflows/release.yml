name: Release verified candidate
on:
  workflow_call:
    inputs:
      artifact_id:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: production-worker
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_CONFIG_PATH: .wrangler.production.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - run: |
          tar -xzf "$RUNNER_TEMP/candidate/candidate.tar.gz"
          pnpm exec tsx scripts/candidate-artifact.ts verify
      - name: Reject a superseded main candidate
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Prepare private production configuration
        env:
          WRANGLER_PRODUCTION_SETTINGS: ${{ secrets.WRANGLER_PRODUCTION_SETTINGS }}
        run: pnpm exec tsx scripts/release-control.ts prepare
      - name: Read current version, bindings and D1 ledger
        run: |
          mkdir -p tmp
          pnpm exec tsx scripts/release-control.ts preflight
      - name: Upload the verified bundle without building
        env:
          WRANGLER_OUTPUT_FILE_PATH: tmp/wrangler-upload.jsonl
        run: |
          if ! pnpm exec wrangler versions upload dist/worker/index.js --config "$WRANGLER_CONFIG_PATH" --no-bundle --message "release $GITHUB_SHA" > "$RUNNER_TEMP/wrangler-upload.log" 2>&1; then
            echo "Worker upload failed. Reconcile the deployment in Cloudflare before retrying."
            exit 1
          fi
      - name: Verify uploaded identity and unchanged production
        id: uploaded
        run: pnpm exec tsx scripts/release-control.ts uploaded
      - name: Switch the verified version to 100 percent
        env:
          VERSION: ${{ steps.uploaded.outputs.version }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if ! pnpm exec wrangler versions deploy "$VERSION@100" --config "$WRANGLER_CONFIG_PATH" --message "release $GITHUB_SHA" --yes > "$RUNNER_TEMP/wrangler-deploy.log" 2>&1; then
            echo "Worker cutover failed. Reconcile the deployment in Cloudflare before retrying."
            exit 1
          fi
      - name: Read back the actual deployment
        run: pnpm exec tsx scripts/release-control.ts deployed
      - name: Preserve the deployed package and release identity
        run: |
          gh release create "worker-$GITHUB_SHA" "$RUNNER_TEMP/candidate/candidate.tar.gz" tmp/release-evidence.json --target "$GITHUB_SHA" --title "Worker $GITHUB_SHA" --notes "CI run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Production readback is in release-evidence.json. Reachability and readiness results remain in this run."
      - name: Production reachability and operator readiness
        env:
          MINI_ADMIN_SECRET: ${{ secrets.MINI_ADMIN_SECRET }}
        run: |
          node --input-type=module <<'JS'
          const config = JSON.parse((await import("node:fs")).readFileSync(process.env.WRANGLER_CONFIG_PATH, "utf8"));
          const {CODEX_API_HOSTNAME} = await import("./src/plans/execution-plans.ts");
          const privateFetch = (url, options) => fetch(url, options).catch(() => { throw Error("Production endpoint request failed"); });
          for (const origin of [...config.routes.filter(route => !route.custom_domain).map(route => "https://" + route.pattern.slice(0,-2)), config.vars.CODEX_EGRESS_BASE_URL]) {
            const response = await privateFetch(origin + "/healthz", {redirect:"error", signal:AbortSignal.timeout(30000)});
            if (!response.ok) throw Error("Production health failed (HTTP " + response.status + ")");
            if (origin === config.vars.CODEX_EGRESS_BASE_URL) {
              if ((await response.text()).trim() !== "ok") throw Error("Egress health failed");
            } else if ((await response.json().catch(() => null))?.ok !== true) throw Error("Worker health failed");
          }
          console.log("Production health: PASS");
          if (!process.env.MINI_ADMIN_SECRET) throw Error("Missing operator readiness credential");
          const response = await privateFetch("https://" + CODEX_API_HOSTNAME + "/admin/readiness", {headers:{Authorization:"Bearer " + process.env.MINI_ADMIN_SECRET}, redirect:"error", signal:AbortSignal.timeout(30000)});
          if (!response.ok) throw Error("Operator readiness HTTP " + response.status);
          const readiness = await response.json().catch(() => null);
          if (readiness?.kind !== "readiness" || readiness.database !== "available" || readiness.token_authority_binding !== "available") throw Error("Operator readiness contract failed");
          console.log("Operator readiness: HTTP 200; provider task not exercised");
          const {createHash} = await import("node:crypto");
          const {consoleClientDigest} = await import("./src/console/generated/console-client.ts");
          const {consoleStylesDigest} = await import("./src/console/generated/console-styles.ts");
          for (const [extension, digest] of [["js", consoleClientDigest], ["css", consoleStylesDigest]]) {
            const asset = await privateFetch("https://" + config.vars.ADMIN_DASHBOARD_HOST + "/admin/console-" + digest + "." + extension, {redirect:"error",signal:AbortSignal.timeout(30000)});
            if (!asset.ok || createHash("sha256").update(Buffer.from(await asset.arrayBuffer())).digest("hex") !== digest) throw Error("Deployed Console asset differs from verified candidate");
            console.log("Deployed Console " + extension + ": candidate bytes PASS");
          }
          JS
      - name: Remove private release files
        if: always()
        run: rm -f "$WRANGLER_CONFIG_PATH" "$RUNNER_TEMP/wrangler-upload.log" "$RUNNER_TEMP/wrangler-deploy.log" tmp/wrangler-upload.jsonl
