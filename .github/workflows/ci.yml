name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan Git-visible artifacts
        run: pnpm run scan:git-artifacts

      - name: Check generated Worker bindings
        run: pnpm run types:check

      - name: Typecheck TypeScript
        run: pnpm run typecheck

      - name: Lint authored console CSS
        run: pnpm run lint:css

      - name: Lint console Tailwind classes
        run: pnpm run lint:classes

      - name: Worker unit tests
        run: pnpm exec vitest run

      - name: Egress shim tests
        run: pnpm run egress:test

      - name: Wrangler dry-run
        run: pnpm run deploy:dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
