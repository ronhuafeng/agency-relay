name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-integrity:
    name: Source integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan Git-visible artifacts
        run: pnpm run scan:git-artifacts

      - name: Check generated Worker bindings
        run: pnpm run types:check

      - name: Typecheck Worker and console TypeScript
        run: |
          pnpm exec tsc --noEmit
          pnpm exec tsc -p tsconfig.client.json --noEmit

  design-enforcement:
    name: Design enforcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate generated design projections
        run: pnpm run console:check

      - name: Enforce authored console CSS contracts
        run: pnpm run lint:css

      - name: Enforce console class and inline-style policy
        run: pnpm run lint:classes

  runtime-contracts:
    name: Runtime contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare pinned Codex client for the synthetic OAuth contract
        run: npm install --prefix "$RUNNER_TEMP/runtime-codex" --no-audit --no-fund @openai/codex@0.156.1

      - name: Worker unit and contract tests
        run: pnpm exec vitest run
        env:
          CODEX_TEST_BIN: ${{ runner.temp }}/runtime-codex/node_modules/.bin/codex

      - name: Egress shim contracts
        run: pnpm run egress:test

      - name: Wrangler deploy dry-run
        run: pnpm run deploy:dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
