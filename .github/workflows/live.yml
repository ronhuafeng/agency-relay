name: Live

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Live suite
        type: choice
        default: all
        options:
          - all
          - core
          - codex
          - grok
          - xai
          - images
          - videos
          - files
          - clients
          - access
          - xai-resources
          - credits
          - billing

permissions:
  contents: read

concurrency:
  group: mini-live-dispatch
  cancel-in-progress: false

jobs:
  select:
    name: select
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select live files
        id: files
        env:
          EVENT_NAME: ${{ github.event_name }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          suite="${SUITE:-all}"
          if [ "$EVENT_NAME" = "schedule" ]; then
            suite="all"
          fi
          files=()
          case "$suite" in
            all)
              while IFS= read -r file; do files+=("$file"); done < <(find tests/live -name '*.test.ts' | sort)
              ;;
            core)
              files=(
                tests/live/smoke.test.ts
                tests/live/codex/core.test.ts
                tests/live/grok/core.test.ts
                tests/live/xai/core.test.ts
              )
              ;;
            codex|grok|xai)
              while IFS= read -r file; do files+=("$file"); done < <(find "tests/live/${suite}" -name '*.test.ts' | sort)
              ;;
            images|videos|files)
              files=(
                "tests/live/grok/${suite}.test.ts"
                "tests/live/xai/${suite}.test.ts"
              )
              ;;
            xai-resources)
              files=(
                tests/live/xai/resources.test.ts
                tests/live/xai/public-url.test.ts
              )
              ;;
            clients)
              while IFS= read -r file; do files+=("$file"); done < <(find tests/live/clients -name '*.test.ts' | sort)
              ;;
            access|credits|billing)
              files=("tests/live/${suite}.test.ts")
              ;;
            *)
              echo "suite rejected"
              exit 1
              ;;
          esac
          if [ "${#files[@]}" -eq 0 ]; then
            echo "suite selected no files"
            exit 1
          fi
          json=$(printf '%s\n' "${files[@]}" | jq -R . | jq -s -c .)
          {
            echo "files<<EOF"
            echo "$json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "selected ${#files[@]} files for ${suite}"

  live:
    name: ${{ matrix.file }}
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        file: ${{ fromJson(needs.select.outputs.files) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run live test
        env:
          MINI_ONLY_CODEX_SURFACE_API_KEY: ${{ secrets.MINI_ONLY_CODEX_SURFACE_API_KEY }}
          MINI_ONLY_GROK_SURFACE_API_KEY: ${{ secrets.MINI_ONLY_GROK_SURFACE_API_KEY }}
          MINI_ONLY_XAI_SURFACE_API_KEY: ${{ secrets.MINI_ONLY_XAI_SURFACE_API_KEY }}
          MINI_ONLY_GROK_SURFACE_CONTROL_API_KEY: ${{ secrets.MINI_ONLY_GROK_SURFACE_CONTROL_API_KEY }}
          MINI_ADMIN_SECRET: ${{ secrets.MINI_ADMIN_SECRET }}
        run: pnpm test:live -- "${{ matrix.file }}"
