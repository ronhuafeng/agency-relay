name: Live

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Live suite
        type: choice
        default: all
        options:
          - all
          - http
          - transactions
          - clients
          - grok-responses
          - xai
          - video
          - credits
          - billing

permissions:
  contents: read

concurrency:
  group: mini-live-dispatch
  cancel-in-progress: false

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run live tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          SUITE: ${{ inputs.suite }}
          MINI_CODEX_API_KEY: ${{ secrets.MINI_CODEX_API_KEY }}
          MINI_GROK_API_KEY: ${{ secrets.MINI_GROK_API_KEY }}
          MINI_XAI_API_KEY: ${{ secrets.MINI_XAI_API_KEY }}
          MINI_GROK_CONTROL_API_KEY: ${{ secrets.MINI_GROK_CONTROL_API_KEY }}
          MINI_ADMIN_SECRET: ${{ secrets.MINI_ADMIN_SECRET }}
        run: |
          set -euo pipefail
          suite="${SUITE:-all}"
          if [ "$EVENT_NAME" = "schedule" ]; then
            suite="all"
          fi
          case "$suite" in
            all)
              pnpm test:live
              ;;
            clients)
              pnpm test:live -- tests/live/clients
              ;;
            http|transactions|grok-responses|xai|video|credits|billing)
              pnpm test:live -- "tests/live/${suite}.test.ts"
              ;;
            *)
              echo "suite rejected"
              exit 1
              ;;
          esac
